html{scroll-padding-top:env(safe-area-inset-top,0px)}

body{margin:0;background:var(--bg);color:var(--tx);font:400 18px/1.55 "Mukta",system-ui,-apple-system,"Noto Sans Devanagari","Segoe UI",sans-serif}
.w{max-width:760px;margin:0 auto;padding:0 18px}
header{padding:20px 0 8px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-weight:800;font-size:17px;color:var(--g)}
.lang{display:flex;border:2px solid var(--g);border-radius:999px;overflow:hidden}
.lang button{font:600 16px "Mukta",sans-serif;padding:6px 16px;border:0;background:transparent;color:var(--g);cursor:pointer;min-height:40px}
.lang button[aria-pressed="true"]{background:var(--g);color:var(--gt)}
h1{font-weight:800;font-size:clamp(34px,8vw,52px);line-height:1.1;margin:28px 0 10px;color:var(--g);letter-spacing:-.01em}
.sub{font-size:19px;color:var(--mu);margin:0 0 22px;max-width:34em}
.help{background:var(--hl);border-radius:14px;padding:14px 16px;margin:0 0 22px}
.help b{display:block;margin-bottom:6px}
.help a{display:inline-block;margin:2px 14px 2px 0;color:var(--tx);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.help small{color:var(--mu);font-weight:400}
#q{width:100%;font:400 18px "Mukta",sans-serif;padding:13px 16px;border-radius:12px;border:2px solid var(--ln);background:var(--sf);color:var(--tx);min-height:50px}
#q:focus,button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--c2);outline-offset:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 20px}
.chips button{font:600 16px "Mukta",sans-serif;padding:8px 16px;border-radius:999px;border:2px solid var(--ln);background:var(--sf);color:var(--tx);cursor:pointer;min-height:42px}
.chips button[aria-pressed="true"]{background:var(--g);border-color:var(--g);color:var(--gt)}
.card{background:var(--sf);border:1px solid var(--ln);border-left:8px solid var(--cc);border-radius:12px;margin:0 0 12px}
.card summary{list-style:none;cursor:pointer;padding:16px 18px;display:block}
.card summary::-webkit-details-marker{display:none}
.card h2{margin:0;font-size:21px;line-height:1.25;font-weight:800;color:var(--cc);display:flex;justify-content:space-between;gap:10px}
.card h2::after{content:"+";font-weight:400;font-size:26px;line-height:1}
.card[open] h2::after{content:"\2212"}
.ben{margin:6px 0 0;font-size:19px;font-weight:600}
.body{padding:0 18px 18px;border-top:1px solid var(--ln)}
.body h3{margin:14px 0 2px;font-size:16px;font-weight:800;color:var(--mu)}
.body p{margin:0}
.go{display:inline-block;margin-top:16px;padding:11px 18px;border-radius:10px;background:var(--g);color:var(--gt);font-weight:700;text-decoration:none;min-height:44px}
.none{padding:24px;text-align:center;color:var(--mu)}
footer{padding:24px 0 36px;color:var(--mu);font-size:15px}
footer p{margin:0 0 8px}
@media(prefers-reduced-motion:no-preference){.card{transition:box-shadow .15s}.card[open]{box-shadow:0 2px 10px rgba(20,83,45,.15)}}
.brandw{display:flex;align-items:center;gap:10px}.logo{width:46px;height:46px;flex:none}
.hero{position:relative;margin:18px 0 20px;border-radius:22px;overflow:hidden;background:linear-gradient(160deg,#0f5132 0%,#15803d 55%,#0d9488 100%);color:#fff}
.hero .tx{padding:26px 22px 0;position:relative;z-index:1}
.hero h1{color:#fff;margin:0 0 8px}.hero .sub{color:#e3f6e8;margin:0 0 6px}
.hero svg{display:block;width:100%;height:auto}
.help{background:linear-gradient(90deg,#fde68a,#fdba74);color:#1f2a1d}.help a{color:#1f2a1d}.help small{color:#4a3a14}
.chips button[aria-pressed="true"]{background:var(--k,var(--g));border-color:var(--k,var(--g));color:#fff}
.card summary{display:flex;gap:14px;align-items:flex-start}
.st{flex:1;min-width:0}
.ic{flex:none;width:50px;height:50px;border-radius:15px;background:var(--cc);display:grid;place-items:center}
.ic svg{width:28px;height:28px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card h2{color:var(--tx)}.body h3{color:var(--cc)}.go{background:var(--cc);color:#fff}
</style>
